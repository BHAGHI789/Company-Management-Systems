name: Django CI/CD with Docker

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

env:
  IMAGE_NAME: company-management-systems

jobs:

  # ==========================================================
  # CI - TEST, LINT & FORMAT
  # ==========================================================
  test:
    name: Test, Lint & Format
    runs-on: ubuntu-latest

    steps:

      # -------------------- Checkout --------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------- Python --------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # -------------------- Node.js --------------------
      # Required for Prettier
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # -------------------- Python Dependencies --------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort

      # -------------------- Node Dependencies --------------------
      - name: Install Node dependencies
        run: |
          npm install

      # ==========================================================
      # PYTHON LINTING
      # ==========================================================

      # -------------------- Flake8 --------------------
      - name: Lint Python with Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 . \
            --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      # ==========================================================
      # PYTHON FORMATTING
      # ==========================================================

      # -------------------- Black --------------------
      - name: Check Python formatting with Black
        run: |
          black --check .

      # -------------------- Isort --------------------
      - name: Check Python imports with Isort
        run: |
          isort --check-only .

      # ==========================================================
      # PRETTIER
      # ==========================================================

      # -------------------- Prettier --------------------
      - name: Check formatting with Prettier
        run: |
          npx prettier --check .

      # ==========================================================
      # DJANGO
      # ==========================================================

      # -------------------- Django System Check --------------------
      - name: Django system check
        run: |
          python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: interviewPractices.settings

      # ==========================================================
      # DJANGO TESTS
      # ==========================================================

      # -------------------- Django Tests --------------------
      - name: Run Django tests
        run: |
          python manage.py test application1 --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: interviewPractices.settings


  # ==========================================================
  # BUILD & PUSH DOCKER IMAGE
  # ==========================================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    # Docker image will be pushed only when code is pushed
    # directly to main or master.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:

      # -------------------- Checkout --------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------- Docker Buildx --------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------- Docker Hub Login --------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------- Docker Metadata --------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # -------------------- Build & Push --------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max